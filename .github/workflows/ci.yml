name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    # B02/T02-04: detección de secretos reales en el repo. Corre gitleaks sobre
    # todo el historial (fetch-depth: 0). Falla el build si encuentra un leak.
    # ⚠️ No bloqueante en este entorno de prueba (continue-on-error): si gitleaks
    # no puede autenticarse/licenciarse, el job se reporta como skip sin romper
    # CI. Para activarlo como barrera dura, quitar `continue-on-error: true`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docs-quality-gate:
    name: Docs Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Validador de documentación Enterprise (MASTER_PROMPT-v2.md §4.1):
      # corre sobre todos los TDD de docs/architecture/ y FALLA el build si
      # alguno baja del umbral (default 80 = estándar "no entregar"). Script
      # Node puro, zero-deps — no requiere pnpm install.
      - name: Docs Quality Gate (docs/architecture/*.md, min 80)
        run: |
          set -e
          echo "📚 Corriendo Quality Gate sobre docs/architecture/*.md (umbral 80/100)"
          for f in docs/architecture/*.md; do
            echo "→ $f"
            node scripts/quality-gate.mjs "$f" --min 80 --quiet
          done
          echo "✅ Todos los TDDs de docs/architecture/ cumplen el umbral 80."

      - name: Report quality gate in PR
        if: always()
        run: |
          {
            echo '## 📚 Docs Quality Gate'
            echo ''
            echo 'Umbral: 80/100 · `docs/architecture/*.md` · [scripts/quality-gate.mjs](scripts/quality-gate.mjs)'
            echo ''
            echo '```'
            for f in docs/architecture/*.md; do
              node scripts/quality-gate.mjs "$f" --min 80 --quiet || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        id: coverage
        run: pnpm test:coverage 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Upload coverage report (lcov + html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 7

      - name: Upload to Codecov (optional)
        if: steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Report coverage summary in PR
        if: always()
        run: |
          {
            echo '## 📊 Coverage Summary'
            echo ''
            echo '```'
            # Extract coverage table: from header "File | % Stmts" to blank line
            awk '/File.*Stmts/,/^$/' coverage-output.txt 2>/dev/null || echo '(coverage not available)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  api-contract-test:
    name: API Contract Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI spec
        run: pnpm test:contract

      - name: Generate Postman collection from OpenAPI
        run: pnpm generate:collection

      - name: Run Newman API contract tests (skip if no API key)
        id: newman
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SCAUDIT_API_KEY }}" ]; then
            npx newman run tests/api-contract/scaudit-api-collection.json \
              --env-var "apiKey=${{ secrets.SCAUDIT_API_KEY }}" \
              --reporters cli,junit \
              --reporter-junit-export results/api-contract.xml \
              --bail \
              --timeout-request 15000 \
              --delay-request 1000 && \
            echo "newman_status=passed" >> "$GITHUB_OUTPUT" || \
            echo "newman_status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "🔑 No SCAUDIT_API_KEY secret — skipping live endpoint tests"
            echo "newman_status=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Newman results
        if: steps.newman.outputs.newman_status == 'passed'
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: results/api-contract.xml
          retention-days: 7

      - name: Report API contract status in PR
        if: always()
        run: |
          {
            echo '## 📋 API Contract Test'
            echo ''
            if [ "${{ steps.newman.outputs.newman_status }}" = "passed" ]; then
              echo '✅ **OpenAPI spec valid** — Newman tests passed against production'
            elif [ "${{ steps.newman.outputs.newman_status }}" = "skipped" ]; then
              echo '✅ **OpenAPI spec valid** — Newman skipped (set `SCAUDIT_API_KEY` secret to enable live endpoint testing)'
            else
              echo '❌ **Newman tests failed** — check artifacts for details'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
