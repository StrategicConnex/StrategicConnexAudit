name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    # B02/T02-04 + TSK-006 (P0): detección de secretos reales en el repo.
    # Corre gitleaks sobre todo el historial (fetch-depth: 0).
    # BARRERA DURA: sin `continue-on-error` — el job FALLA el pipeline si
    # gitleaks detecta un leak (REQ-106, SECURITY-AUDIT VULN-000).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # Exit code 1 on leak → step fails → job fails (barrera dura).

  docs-quality-gate:
    name: Docs Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Validador de documentación Enterprise (MASTER_PROMPT-v2.md §4.1):
      # corre sobre los TDDs técnicos (arquitectura, BD, jobs, módulos,
      # trazabilidad, riesgo, deuda técnica, testing) y FALLA el build si alguno
      # baja del umbral (default 80 = estándar "no entregar"). Script Node puro,
      # zero-deps — no requiere pnpm install.
      #
      # Umbral por carpeta (--min-dir): los JOB-CONTRACT de docs/jobs son
      # contratos de Trigger.dev con requisitos más estrictos → exigen 90/100,
      # mientras el resto de TDDs técnicos sigue en 80/100.
      #
      # EXCLUSIONES deliberadas: MASTER-INDEX.md y los planes de gobernanza
      # (docs/superpowers/) son índices/planes, no TDDs técnicos — no se validan.
      - name: Docs Quality Gate (docs técnicos, min 80 · docs/jobs min 90)
        run: |
          set -e
          # nullglob: las carpetas sin .md commiteados expanden el glob a vacío
          # y se omiten — el job valida lo que existe en el checkout, sin fallar.
          shopt -s nullglob
          DIRS="docs/architecture docs/database docs/jobs docs/modules docs/traceability docs/risk docs/technical-debt docs/testing"
          echo "📚 Corriendo Quality Gate sobre docs técnicos (80/100 · docs/jobs 90/100)"
          for d in $DIRS; do
            for f in "$d"/*.md; do
              echo "→ $f"
              node scripts/quality-gate.mjs "$f" --min 80 --min-dir docs/jobs=90 --quiet
            done
          done
          echo "✅ Todos los TDDs técnicos cumplen el umbral requerido."

      - name: Report quality gate in PR
        if: always()
        run: |
          # Tabla de scores por carpeta (modo --table del validador): emite
          # docs, PASS, promedio, mínimo, máximo y umbral por carpeta + TOTAL,
          # con los docs bajo el umbral listados al final. Sin code fence para
          # que GitHub lo renderice como tabla Markdown en el PR summary.
          node scripts/quality-gate.mjs --table docs/architecture docs/database docs/jobs docs/modules docs/traceability docs/risk docs/technical-debt docs/testing --min 80 --min-dir docs/jobs=90 > /tmp/qg-table.txt || true
          {
            echo '## 📚 Docs Quality Gate'
            echo ''
            echo 'Umbral: 80/100 (docs/jobs 90/100) · TDDs técnicos (architecture/database/jobs/modules/traceability/risk/technical-debt/testing) · [scripts/quality-gate.mjs](scripts/quality-gate.mjs)'
            echo ''
            cat /tmp/qg-table.txt
          } >> "$GITHUB_STEP_SUMMARY"

  test-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        id: coverage
        run: pnpm test:coverage 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Upload coverage report (lcov + html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 7

      - name: Upload to Codecov (optional)
        if: steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Report coverage summary in PR
        if: always()
        run: |
          {
            echo '## 📊 Coverage Summary'
            echo ''
            echo '```'
            # Extract coverage table: from header "File | % Stmts" to blank line
            awk '/File.*Stmts/,/^$/' coverage-output.txt 2>/dev/null || echo '(coverage not available)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  api-contract-test:
    name: API Contract Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI spec
        run: pnpm test:contract

      - name: Generate Postman collection from OpenAPI
        run: pnpm generate:collection

      - name: Run Newman API contract tests (skip if no API key)
        id: newman
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SCAUDIT_API_KEY }}" ]; then
            npx newman run tests/api-contract/scaudit-api-collection.json \
              --env-var "apiKey=${{ secrets.SCAUDIT_API_KEY }}" \
              --reporters cli,junit \
              --reporter-junit-export results/api-contract.xml \
              --bail \
              --timeout-request 15000 \
              --delay-request 1000 && \
            echo "newman_status=passed" >> "$GITHUB_OUTPUT" || \
            echo "newman_status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "🔑 No SCAUDIT_API_KEY secret — skipping live endpoint tests"
            echo "newman_status=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Newman results
        if: steps.newman.outputs.newman_status == 'passed'
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: results/api-contract.xml
          retention-days: 7

      - name: Report API contract status in PR
        if: always()
        run: |
          {
            echo '## 📋 API Contract Test'
            echo ''
            if [ "${{ steps.newman.outputs.newman_status }}" = "passed" ]; then
              echo '✅ **OpenAPI spec valid** — Newman tests passed against production'
            elif [ "${{ steps.newman.outputs.newman_status }}" = "skipped" ]; then
              echo '✅ **OpenAPI spec valid** — Newman skipped (set `SCAUDIT_API_KEY` secret to enable live endpoint testing)'
            else
              echo '❌ **Newman tests failed** — check artifacts for details'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
