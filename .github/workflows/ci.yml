name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # RULE-001 (GOLDEN_RULES v3.1): FALLA si env-secrets se importa desde
      # código de cliente o si env.ts vuelve a definir getters de secretos.
      # Script Node zero-deps (scripts/guard-client-secrets.mjs) — corre
      # antes del build como barrera dura, sin requerir bundling.
      - name: Guard RULE-001 (secretos server-only)
        run: pnpm guard:secrets

      - run: pnpm build

      # VULN-010 (SECURITY-AUDIT-REPORT v2.4): FALLA si el bundle cliente
      # compilado (.next/static + .next/server/app) contiene URLs de CDNs de
      # terceros (unpkg, jsdelivr, cartocdn, fonts.googleapis/gstatic) que
      # exfiltrarían IP/referrer/geolocalización. Barrera dura post-build.
      - name: Guard VULN-010 (bundle sin CDNs de terceros)
        run: pnpm guard:cdn

      # P1-4: paridad i18n — falla si es/en divergen (claves huérfanas).
      - name: Guard i18n parity (es/en)
        run: node scripts/i18n-parity.mjs --max-divergence 0.02

      # QW5 paleta: falla si un token de texto baja de 4.5:1 WCAG.
      - name: Guard contrast (WCAG AA tokens)
        run: node scripts/contrast-guard.mjs

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    # B02/T02-04 + TSK-006 (P0): detección de secretos reales en el repo.
    # Corre gitleaks sobre todo el historial (fetch-depth: 0).
    # BARRERA DURA: sin `continue-on-error` — el job FALLA el pipeline si
    # gitleaks detecta un leak (REQ-106, SECURITY-AUDIT VULN-000).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # Exit code 1 on leak → step fails → job fails (barrera dura).

  docs-quality-gate:
    name: Docs Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Validador de documentación Enterprise (MASTER_PROMPT-v2.md §4.1):
      # corre sobre los TDDs técnicos (arquitectura, BD, jobs, módulos,
      # trazabilidad, riesgo, deuda técnica, testing) y FALLA el build si alguno
      # baja del umbral (default 80 = estándar "no entregar"). Script Node puro,
      # zero-deps — no requiere pnpm install.
      #
      # Umbral por carpeta (--min-dir): los JOB-CONTRACT de docs/jobs son
      # contratos de Trigger.dev con requisitos más estrictos → exigen 90/100,
      # mientras el resto de TDDs técnicos sigue en 80/100.
      #
      # EXCLUSIONES deliberadas: MASTER-INDEX.md y los planes de gobernanza
      # (docs/superpowers/) son índices/planes, no TDDs técnicos — no se validan.
      - name: Docs Quality Gate (docs técnicos, min 80 · docs/jobs min 90)
        run: |
          set -e
          # nullglob: las carpetas sin .md commiteados expanden el glob a vacío
          # y se omiten — el job valida lo que existe en el checkout, sin fallar.
          shopt -s nullglob
          DIRS="docs/architecture docs/database docs/jobs docs/modules docs/traceability docs/risk docs/technical-debt docs/testing"
          echo "📚 Corriendo Quality Gate sobre docs técnicos (80/100 · docs/jobs 90/100)"
          for d in $DIRS; do
            for f in "$d"/*.md; do
              echo "→ $f"
              node scripts/quality-gate.mjs "$f" --min 80 --min-dir docs/jobs=90 --quiet
            done
          done
          echo "✅ Todos los TDDs técnicos cumplen el umbral requerido."

      - name: Report quality gate in PR
        if: always()
        run: |
          # Tabla de scores por carpeta (modo --table del validador): emite
          # docs, PASS, promedio, mínimo, máximo y umbral por carpeta + TOTAL,
          # con los docs bajo el umbral listados al final. Sin code fence para
          # que GitHub lo renderice como tabla Markdown en el PR summary.
          node scripts/quality-gate.mjs --table docs/architecture docs/database docs/jobs docs/modules docs/traceability docs/risk docs/technical-debt docs/testing --min 80 --min-dir docs/jobs=90 > /tmp/qg-table.txt || true
          {
            echo '## 📚 Docs Quality Gate'
            echo ''
            echo 'Umbral: 80/100 (docs/jobs 90/100) · TDDs técnicos (architecture/database/jobs/modules/traceability/risk/technical-debt/testing) · [scripts/quality-gate.mjs](scripts/quality-gate.mjs)'
            echo ''
            cat /tmp/qg-table.txt
          } >> "$GITHUB_STEP_SUMMARY"

  test-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        id: coverage
        # `pipefail` es imprescindible: sin él, el exit status del paso lo fija
        # `tee` (siempre 0) y una suite en rojo dejaría el pipeline en verde.
        run: set -o pipefail; pnpm test:coverage 2>&1 | tee coverage-output.txt

      - name: Upload coverage report (lcov + html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 7

      - name: Upload to Codecov (optional)
        if: steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Report coverage summary in PR
        if: always()
        run: |
          {
            echo '## 📊 Coverage Summary'
            echo ''
            echo '```'
            # Extract coverage table: from header "File | % Stmts" to blank line
            awk '/File.*Stmts/,/^$/' coverage-output.txt 2>/dev/null || echo '(coverage not available)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # DB-DRIFT en cada push (lección del drift 0025-0032 detectado en prod):
  # FALLA si el schema de Drizzle y la BD divergen. El check PROGRAMADO diario
  # (detección sin pushes) vive en .github/workflows/db-drift.yml.
  db-drift-check:
    name: DB Drift Check (schema vs BD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Check migrations journal integrity
        run: pnpm exec drizzle-kit check

      # Guard estatico (sin BD): clasifica las 74 tablas y exige RLS donde toca.
      # No necesita DIRECT_URL, asi que corre SIEMPRE y no se omite con el secreto.
      - name: RLS inventory guard (static)
        run: pnpm rls:inventory

      - name: Anti-drift (schema Drizzle vs BD)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::warning::Secreto DIRECT_URL no configurado — check de drift contra la BD OMITIDO (el journal de migraciones SÍ se validó arriba)."
            {
              echo '## 🗄️ DB Drift Check'
              echo ''
              echo '⚠️ **Omitido** — falta el secreto `DIRECT_URL` (Settings → Secrets → Actions).'
              echo 'El check `drizzle-kit check` (integridad del journal) sí corrió.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/db/drift-check.mjs

      # Defecto raíz de P0.5 (2026-10-12): `drift-check.mjs` trata las FK como
      # drift ADHESIVO (avisa, no falla), así que 11 FK declaradas en el schema
      # estuvieron ausentes en producción sin que nada se pusiera rojo (250 filas
      # huérfanas). Este guard hace del conjunto de FK un chequeo DURO: falla si
      # una FK declarada no existe o si su ON DELETE difiere del declarado.
      - name: FK drift guard (declaradas vs BD)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::warning::Secreto DIRECT_URL no configurado — guard de FK OMITIDO (el journal de migraciones SÍ se validó arriba)."
            {
              echo '## 🔗 FK Drift Guard'
              echo ''
              echo '⚠️ **Omitido** — falta el secreto `DIRECT_URL`.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/db/fk-schema-drift-guard.mjs

      # Hallazgo #6 (auditoría de BD 2026-10-11): `TRUNCATE` estaba concedido a
      # `authenticated` en 33 tablas de `public`. TRUNCATE NO pasa por RLS, así
      # que anulaba el aislamiento multi-tenant para ese comando. El guard
      # estático de vitest (tests/security/truncate-grant-guard.test.ts) protege
      # la migración; este paso verifica el estado REAL de la base.
      - name: Grant audit (TRUNCATE a roles expuestos)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::warning::Secreto DIRECT_URL no configurado — grant audit OMITIDO (el guard estático de vitest SÍ corrió)."
            {
              echo '## 🔐 Grant Audit'
              echo ''
              echo '⚠️ **Omitido** — falta el secreto `DIRECT_URL`.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/db/grant-audit.mjs

      - name: RLS surface guard (anti-regresión de llamadas fuera de withRLS)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::warning::Secreto DIRECT_URL no configurado — guard de superficie RLS omitido (corre localmente y en otro pipeline con la BD real)."
            exit 0
          fi
          pnpm db:rls-surface-guard

      - name: Report drift status
        if: always()
        run: |
          {
            echo '## 🗄️ DB Drift Check'
            echo ''
            echo 'Schema Drizzle (`src/shared/db/schemas`) vs BD — conexión solo lectura.'
            echo ''
            echo 'Estado: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # NEXT_PUBLIC_* viajan al bundle del navegador: son configuración pública,
    # no secretos. Se leen de `secrets` si existen y caen a defaults públicos
    # para que el job nunca falle por configuración ausente (lección del
    # fallo "Your project's URL and Key are required to create a Supabase
    # client!" — el job no tenía NINGÚN env y el dev server no arrancaba).
    #
    # DATABASE_URL / DIRECT_URL / OPENROUTER_API_KEY también son requeridas,
    # pero por `validateEnv()` de `src/instrumentation.ts` (fail-fast): sin
    # ellas `pnpm dev` aborta y todo el job acaba en ECONNREFUSED :3000.
    # Los fallbacks tienen formato válido y ningún test toca Postgres (los
    # guards de auth redirigen en middleware y las APIs devuelven 401/JSON).
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://qwebfomwtwxxbkxbrrwm.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_ci_placeholder' }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_DEV_BYPASS_AUTH: 'false'
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@127.0.0.1:5432/strategicaudit_ci' }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres:postgres@127.0.0.1:5432/strategicaudit_ci' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-ci-placeholder' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run auth + smoke E2E (webServer levanta pnpm dev)
        run: pnpm exec playwright test e2e/home.spec.ts e2e/app.spec.ts e2e/pentest-auth-ratelimit.spec.ts --workers=1
      # Los specs de auditoría UX y regresión visual corren también, pero como
      # señal informativa: el primero genera hallazgos (no aserciones duras) y
      # el segundo tiene baselines versionadas solo para win32 (`*-win32.png`),
      # por lo que en Linux no hay con qué comparar hasta generarlos allí.
      - name: Run UX simulation + visual regression (informativo, no bloquea)
        continue-on-error: true
        run: pnpm exec playwright test e2e/end-user-simulation.spec.ts e2e/visual-regression.spec.ts --workers=1

  api-contract-test:
    name: API Contract Test
    runs-on: ubuntu-latest
    # El contrato en vivo SOLO puede apuntar a un entorno NO productivo.
    # `TEST_ENV` declara el entorno objetivo (staging|test) y
    # `SCAUDIT_CONTRACT_BASE_URL` la URL base contra la que Newman dispara.
    # Son *variables* de repositorio, no secretos (una URL no lo es):
    # Settings → Secrets and variables → Actions → Variables.
    # Sin ambas, el guard `target` FALLA con un ::error:: explícito en vez de
    # golpear producción o de cerrar el pipeline en verde por omisión.
    env:
      TEST_ENV: ${{ vars.TEST_ENV }}
      SCAUDIT_CONTRACT_BASE_URL: ${{ vars.SCAUDIT_CONTRACT_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI spec
        run: pnpm test:contract

      - name: Generate Postman collection from OpenAPI
        run: pnpm generate:collection

      # ── Guard: prohibir el contrato en vivo contra PRODUCCIÓN ─────────────
      # El contrato se ejecuta con Newman, que lanza peticiones REALES contra un
      # servidor. Hasta 2026-10-10 este job las lanzaba contra producción en cada
      # push/PR: la colección incrustaba la URL de `servers[0]` del OpenAPI, que
      # es prod. Ahora el target es explícito y se valida ANTES de disparar nada:
      #   1. `TEST_ENV` debe ser `staging` o `test`.
      #   2. `SCAUDIT_CONTRACT_BASE_URL` debe existir y su host no puede ser uno
      #      de los hosts de producción conocidos.
      # En PRs desde forks GitHub no expone las variables del repo: se omite con
      # un `::warning::` visible (misma excepción que aplica al secreto de API).
      - name: Guard — prohibir el contrato en vivo contra producción
        id: target
        run: |
          set -euo pipefail

          blocked() {
            echo "::error::$1"
            echo "target_status=blocked" >> "$GITHUB_OUTPUT"
            exit 1
          }

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::warning::PR de fork: sin acceso a las variables del repo — se omite el contrato en vivo (solo OpenAPI offline)"
            echo "target_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${TEST_ENV:-}" != "staging" ] && [ "${TEST_ENV:-}" != "test" ]; then
            blocked "ERROR: No se permiten pruebas de contrato contra producción (TEST_ENV='${TEST_ENV:-<vacío>}'; se exige 'staging' o 'test'). Define la variable de repositorio TEST_ENV."
          fi

          TARGET="${SCAUDIT_CONTRACT_BASE_URL:-}"
          if [ -z "$TARGET" ]; then
            blocked "ERROR: No se permiten pruebas de contrato contra producción (falta SCAUDIT_CONTRACT_BASE_URL con el host de staging/test)."
          fi

          HOST="$(printf '%s' "$TARGET" | sed -E 's#^[A-Za-z][A-Za-z0-9+.-]*://##; s#[/?].*$##; s#:.*$##')"
          if [ -z "$HOST" ]; then
            blocked "ERROR: SCAUDIT_CONTRACT_BASE_URL no es una URL válida ('$TARGET')."
          fi

          for PROD_HOST in scaudit.vercel.app www.scaudit.vercel.app strategicaudit.pro www.strategicaudit.pro; do
            if [ "$HOST" = "$PROD_HOST" ]; then
              blocked "ERROR: No se permiten pruebas de contrato contra producción (host '$HOST' es de producción). Apunta SCAUDIT_CONTRACT_BASE_URL a un entorno de staging/test."
            fi
          done

          # El override sólo funciona si la colección referencia `{{baseUrl}}`.
          # Si vuelve a incrustar URLs absolutas, Newman golpearía el default
          # del spec (producción) aunque este guard diga OK.
          COLLECTION="tests/api-contract/scaudit-api-collection.json"
          if [ ! -f "$COLLECTION" ]; then
            blocked "ERROR: falta $COLLECTION (¿falló el paso Generate Postman collection?)."
          fi
          RAW_TOTAL="$(grep -cF '"raw": ' "$COLLECTION" || true)"
          RAW_REF="$(grep -cF '"raw": "{{baseUrl}}/' "$COLLECTION" || true)"
          if [ "$RAW_TOTAL" = "0" ] || [ "$RAW_TOTAL" != "$RAW_REF" ]; then
            blocked "ERROR: la colección no es reapuntable ($RAW_REF de $RAW_TOTAL requests usan {{baseUrl}}): Newman ignoraría SCAUDIT_CONTRACT_BASE_URL y golpearía el default del spec. Revisa generate-collection.mjs."
          fi

          echo "Contrato en vivo contra $HOST (TEST_ENV=$TEST_ENV) — $RAW_REF/$RAW_TOTAL requests reapuntables"
          echo "target_status=ok" >> "$GITHUB_OUTPUT"

      # NOTA (2026-10-10): el guard `target` corre ANTES de este paso, así que
      # Newman ya no puede alcanzar producción: sin un target no productivo
      # declarado el job falla antes de disparar una sola petición.
      # DECISION: un contrato roto contra produccion SI tumba el pipeline, y la
      # AUSENCIA del secreto `SCAUDIT_API_KEY` tambien: el paso FALLA con
      # `newman_status=missing_secret` en lugar de cerrar en verde por omision.
      # La unica exencion es un PR desde un fork, donde GitHub no expone los
      # secretos del repo: alli se omite con un `::warning::` visible y
      # `newman_status=skipped`. En cuanto el secreto existe, un
      # 401/403/scope/rate-limit fuera de contrato devuelve un exit code != 0
      # que propagamos tal cual para romper el job.
      # Antes `... && echo passed || echo failed` fijaba siempre exit 0: el
      # fallo se perdia y el contrato roto cerraba el pipeline en verde.
      # Requiere el secreto `SCAUDIT_API_KEY` (ver `.env.example` → "API pública
      # v1 — contrato Newman"). Configúralo en
      # Settings → Secrets and variables → Actions → New repository secret.
      - name: Run Newman API contract tests against the non-production target
        id: newman
        if: steps.target.outputs.target_status == 'ok'
        run: |
          if [ -z "${{ secrets.SCAUDIT_API_KEY }}" ]; then
            # Los PRs de fork ya no llegan aquí: el guard `target` los omite antes.
            echo "::error::Falta el secreto SCAUDIT_API_KEY: el contrato de la API pública no se puede validar en vivo. Configúralo en Settings → Secrets and variables → Actions → New repository secret."
            echo "newman_status=missing_secret" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          newman_rc=0
          npx newman run tests/api-contract/scaudit-api-collection.json \
            --env-var "apiKey=${{ secrets.SCAUDIT_API_KEY }}" \
            --env-var "baseUrl=$SCAUDIT_CONTRACT_BASE_URL" \
            --reporters cli,junit \
            --reporter-junit-export results/api-contract.xml \
            --bail \
            --timeout-request 15000 \
            --delay-request 1000 || newman_rc=$?

          if [ "$newman_rc" -eq 0 ]; then
            echo "newman_status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "newman_status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::Newman detecto un contrato roto contra produccion (exit $newman_rc)"
            exit "$newman_rc"
          fi

      # `always()` para subir el JUnit tambien cuando Newman falla: con el
      # filtro anterior (`== 'passed'`) el diagnostico de la rotura se perdia.
      # Con el target bloqueado/omitido no hay JUnit que subir: se restringe a
      # los dos estados en los que Newman llegó a ejecutarse.
      - name: Upload Newman results
        if: always() && (steps.newman.outputs.newman_status == 'passed' || steps.newman.outputs.newman_status == 'failed')
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: results/api-contract.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Report API contract status in PR
        if: always()
        run: |
          {
            echo '## 📋 API Contract Test'
            echo ''
            if [ "${{ steps.target.outputs.target_status }}" = "blocked" ]; then
              echo '❌ **Contrato en vivo bloqueado** — sin un target no productivo (`TEST_ENV` en {staging,test} + `SCAUDIT_CONTRACT_BASE_URL`) el job no dispara ninguna petición. Ver el ::error:: del paso *Guard*.'
            elif [ "${{ steps.target.outputs.target_status }}" = "skipped" ]; then
              echo '✅ **OpenAPI spec valid** — contrato en vivo omitido (PR de fork: el repo no expone sus variables)'
            elif [ "${{ steps.newman.outputs.newman_status }}" = "passed" ]; then
              echo '✅ **OpenAPI spec valid** — Newman tests passed against the non-production target'
            elif [ "${{ steps.newman.outputs.newman_status }}" = "skipped" ]; then
              echo '✅ **OpenAPI spec valid** — Newman skipped (fork PR: `SCAUDIT_API_KEY` no disponible)'
            elif [ "${{ steps.newman.outputs.newman_status }}" = "missing_secret" ]; then
              echo '❌ **Falta el secreto `SCAUDIT_API_KEY`** — el contrato en vivo no se ejecutó y el job falla'
            else
              echo '❌ **Newman tests failed** — check artifacts for details'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
