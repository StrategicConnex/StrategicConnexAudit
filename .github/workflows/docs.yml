name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        if: false # desactivado: Liquid rompía con ejemplos de código (rojo desde 2026-10-14)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Copy docs statically (no Jekyll)
        # Copia plana de ./docs → ./_site: sirve los markdown tal cual.
        # Evita Liquid a perpetuidad (cualquier {{ }} en ejemplos tumba el build).
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
