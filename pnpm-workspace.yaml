allowBuilds:
  '@parcel/watcher': set this to true or false
  '@scarf/scarf': set this to true or false
  '@swc/core': set this to true or false
  '@tree-sitter-grammars/tree-sitter-yaml': set this to true or false
  core-js: set this to true or false
  core-js-pure: set this to true or false
  esbuild: set this to true or false
  msw: set this to true or false
  tree-sitter: set this to true or false
  tree-sitter-json: set this to true or false
  unrs-resolver: set this to true or false

# Ajustes de pnpm (v10+ los lee de aquí, no de package.json#pnpm).
# Vercel usa pnpm 10.x: también soporta pnpm-workspace.yaml.

onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@scarf/scarf'
  - esbuild
  - protobufjs
  - core-js
  - '@biomejs/biome'
  - es5-ext
  - msw

# Parcheo de vulnerabilidades en dependencias transitivas (audit 2026-09-21).
# Los rangos evitan tocar líneas no vulnerables (ej. brace-expansion@1.x de
# minimatch@3, que NO es vulnerable y rompería el parser si se sube).
overrides:
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
  'socket.io-parser@>=4.0.0 <4.2.7': '>=4.2.7'
  'brace-expansion@>=3.0.0 <5.0.9': '>=5.0.9'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'deepmerge-ts@<8.0.0': '>=8.0.0'
  'browserslist@<=4.28.6': '>=4.28.7'
  'dompurify@<=3.4.12': '>=3.4.13'
  '@opentelemetry/core@>=2.0.0 <2.8.0': '>=2.8.0'
  'fflate@>=0.8.0 <0.8.3': '>=0.8.3'
  'baseline-browser-mapping@>=2.0.0 <2.11.0': '>=2.11.0'
  '@babel/core@<=7.29.0': '>=7.29.6'
  'brace-expansion@>=1.1.0 <1.1.18': '>=1.1.18'
  'nanoid@>=3.0.0 <3.3.18': '>=3.3.18'
  'postcss@<8.5.18': '>=8.5.18'
  'fast-uri@<3.1.6': '>=3.1.6'
  'ip-address@<10.3.1': '>=10.3.1'
  'hono@<4.12.25': '>=4.12.25'
  'qs@<6.16.0': '>=6.16.0'
  '@hono/node-server@<1.19.15': '>=1.19.15'
  'body-parser@>=2.0.0 <2.3.0': '>=2.3.0'
  'postcss-selector-parser@>=7.1.0 <7.1.3': '>=7.1.3'
  'vite@>=8.0.0 <=8.0.15': '>=8.0.16'
