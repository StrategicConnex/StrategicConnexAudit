# Ajustes de pnpm (v10+ los lee de aquí, no de package.json#pnpm).
#
# Compatibilidad:
#   - pnpm 10 (Vercel): usa `onlyBuiltDependencies` (allowlist; lo no listado
#     solo avisa, no falla).
#   - pnpm 11/12 (CI / local): usa `allowBuilds`; lo NO aprobado es ERROR duro
#     en install (ERR_PNPM_IGNORED_BUILDS).
#
# Ambas secciones deben mantenerse sincronizadas.

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false # telemetría de instalación: no la aprobamos
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msw: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - '@tree-sitter-grammars/tree-sitter-yaml'
  - core-js
  - core-js-pure
  - esbuild
  - msw
  - tree-sitter
  - tree-sitter-json
  - unrs-resolver

# Parcheo de vulnerabilidades en dependencias transitivas (audit 2026-09-21).
# Los rangos evitan tocar líneas no vulnerables (ej. brace-expansion@1.x de
# minimatch@3, que NO es vulnerable y rompería el parser si se sube).
overrides:
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
  'socket.io-parser@>=4.0.0 <4.2.7': '>=4.2.7'
  'brace-expansion@>=3.0.0 <5.0.9': '>=5.0.9'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'deepmerge-ts@<8.0.0': '>=8.0.0'
  'browserslist@<=4.28.6': '>=4.28.7'
  'dompurify@<=3.4.12': '>=3.4.13'
  '@opentelemetry/core@>=2.0.0 <2.8.0': '>=2.8.0'
  'fflate@>=0.8.0 <0.8.3': '>=0.8.3'
  'baseline-browser-mapping@>=2.0.0 <2.11.0': '>=2.11.0'
  '@babel/core@<=7.29.0': '>=7.29.6'
  'brace-expansion@>=1.1.0 <1.1.18': '>=1.1.18'
  'nanoid@>=3.0.0 <3.3.18': '>=3.3.18'
  'postcss@<8.5.18': '>=8.5.18'
  'fast-uri@<3.1.6': '>=3.1.6'
  'ip-address@<10.3.1': '>=10.3.1'
  'hono@<4.12.25': '>=4.12.25'
  'qs@<6.16.0': '>=6.16.0'
  '@hono/node-server@<1.19.15': '>=1.19.15'
  'body-parser@>=2.0.0 <2.3.0': '>=2.3.0'
  'postcss-selector-parser@>=7.1.0 <7.1.3': '>=7.1.3'
  'vite@>=8.0.0 <=8.0.15': '>=8.0.16'
